<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文單字收伏戰 Word Catchers</title>
    <style>
        :root {
            --primary: #FFCC00;
            --blue-tint: #3B4CCA;
            --background: #F0F4F8;
            --text: #2F3E46;
        }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', '微軟正黑體', sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 20px;
            border: 4px solid var(--primary);
            text-align: center;
        }
        h1 { color: var(--blue-tint); margin-top: 0; font-size: 24px; margin-bottom: 10px; }
        
        /* 關卡資訊與進度 */
        .stage-info {
            background: #FFE66D;
            border-radius: 10px;
            padding: 5px 15px;
            display: inline-block;
            font-weight: bold;
            color: #333;
            font-size: 14px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 野生怪獸遭遇區 (全面精簡縮小) */
        .battle-stage {
            background: linear-gradient(to bottom, #BDE0FE, #EAEAEA);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 20px;
            border: 2px solid #A2D2FF;
        }
        .wild-title {
            font-weight: bold;
            color: #d90429;
            font-size: 13px; /* 標題再縮小 */
            background: white;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 15px;
        }
        .monster-avatar {
            font-size: 55px; /* 精簡的怪獸圖片尺寸 */
            margin: 8px 0;
            animation: wild_bounce 1.5s infinite ease-in-out;
            display: inline-block;
        }
        @keyframes wild_bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.05); }
        }
        
        /* 答題收伏區 */
        .quiz-box {
            background: #FFF;
            border: 2px dashed var(--blue-tint);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .word-display {
            font-size: 36px;
            font-weight: bold;
            color: #1D3557;
            margin-bottom: 5px;
        }
        .audio-btn {
            background: #EAF2F8;
            border: 1px solid #A9CCE3;
            border-radius: 20px;
            font-size: 15px;
            padding: 4px 12px;
            cursor: pointer;
            margin-bottom: 15px;
            color: #2471A3;
            font-weight: bold;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background: white;
            border: 2px solid #CED4DA;
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        .option-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }
        .feedback { font-size: 17px; font-weight: bold; margin-top: 15px; height: 25px; }

        /* 寵物圖鑑背包區 */
        .collection-box {
            background: #F8F9FA;
            border-radius: 15px;
            padding: 15px;
            border: 2px solid #E5E7EB;
            text-align: left;
        }
        .collection-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            color: #4A5568;
            border-bottom: 2px solid #CBD5E1;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .grid-bag {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
            padding: 5px;
        }
        .bag-slot {
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            text-align: center;
            padding: 4px 0;
            font-size: 22px;
            position: relative;
        }
        .bag-slot .tooltip {
            visibility: hidden; font-size: 10px; background-color: #333; color: #fff;
            text-align: center; border-radius: 4px; padding: 2px 5px;
            position: absolute; z-index: 1; bottom: 100%; left: 50%;
            transform: translateX(-50%); white-space: nowrap;
        }
        .bag-slot:hover .tooltip { visibility: visible; }

        .reset-btn { background: none; border: none; color: #9CA3AF; cursor: pointer; font-size: 11px; margin-top: 15px; text-decoration: underline; }
    </style>
</head>
<body onclick="unlockAudioContext()">

<div class="game-container">
    <h1>⚡ 英文單字收伏戰 ⚡</h1>
    
    <div id="current-stage-display" class="stage-info">載入中...</div>

    <div class="battle-stage">
        <div class="wild-title">💥 野生單字怪獸出現！</div>
        <div><span id="monster-emoji" class="monster-avatar">❓</span></div>
        <div style="font-size: 14px; color: #555; font-weight: bold;">
            當前關卡進度：<span id="stage-score" style="color:#3B4CCA; font-size:16px;">0</span> / 50 隻
        </div>
    </div>

    <div class="quiz-box">
        <div id="word-text" class="word-display">---</div>
        <button onclick="speakWord()" class="audio-btn">🔊 再聽一次發音</button>
        
        <div class="options-grid">
            <button class="option-btn" onclick="checkAnswer(0)">選項 1</button>
            <button class="option-btn" onclick="checkAnswer(1)">選項 2</button>
            <button class="option-btn" onclick="checkAnswer(2)">選項 3</button>
            <button class="option-btn" onclick="checkAnswer(3)">選項 4</button>
        </div>
        <div id="feedback-text" class="feedback"></div>
    </div>

    <div class="collection-box">
        <div class="collection-title">
            <span>🎒 我的總寵物圖鑑背包</span>
            <span id="bag-count" style="color: #6B7280;">0 / 300 隻</span>
        </div>
        <div id="bag-grid" class="grid-bag"></div>
    </div>

    <button class="reset-btn" onclick="resetGame()">放生所有寵物（重設進度）</button>
</div>

    {word: "dirty", ch: "髒的", icon: "💩"}, {word: "new", ch: "新的", icon: "🆕"}, {word: "old", ch: "舊/老的", icon: "🧓"}, {word: "fast", ch: "快的", icon: "⚡"}, 
    {word: "slow", ch: "慢的", icon: "🐢"}, {word: "easy", ch: "容易的", icon: "💡"}, {word: "hard", ch: "困難的", icon: "🧩"}, {word: "heavy", ch: "重的", icon: "🏋️"}, 
    {word: "light", ch: "輕的", icon: "🪶"}, {word: "brave", ch: "勇敢的", icon: "🦁"}, {word: "run", ch: "跑步", icon: "🏃"}, {word: "jump", ch: "跳躍", icon: "🦘"}, 
    {word: "walk", ch: "走路", icon: "🚶"}, {word: "swim", ch: "游泳", icon: "🏊"}, {word: "fly", ch: "飛翔", icon: "🦅"}, {word: "dance", ch: "跳舞", icon: "💃"}, 
    {word: "sing", ch: "唱歌", icon: "🎤"}, {word: "play", ch: "玩耍", icon: "🎮"}, {word: "eat", ch: "吃", icon: "🍔"}, {word: "drink", ch: "喝", icon: "🥤"}, 
    {word: "sleep", ch: "睡覺", icon: "🛌"}, {word: "wash", ch: "洗", icon: "🧼"}, {word: "open", ch: "打開", icon: "🔓"}, {word: "close", ch: "關上", icon: "🔒"}, 
    {word: "push", ch: "推", icon: "🫸"}, {word: "pull", ch: "拉", icon: "🫷"}, {word: "climb", ch: "攀爬", icon: "🧗"}, {word: "ride", ch: "騎車", icon: "🚴"}, 
    {word: "cook", ch: "煮飯", icon: "🍳"}, {word: "cry", ch: "哭泣", icon: "😢"}, {word: "see", ch: "看見", icon: "👓"}, {word: "look", ch: "看", icon: "👀"}, 
    {word: "hear", ch: "聽見", icon: "📢"}, {word: "listen", ch: "聽", icon: "🎧"}, {word: "speak", ch: "說話", icon: "🗣️"}, {word: "say", ch: "說", icon: "💬"}, 
    {word: "talk", ch: "交談", icon: "🗣️"}, {word: "read", ch: "閱讀", icon: "📚"}, {word: "write", ch: "寫字", icon: "✍️"}, {word: "draw", ch: "畫畫", icon: "🎨"},
    {word: "know", ch: "知道", icon: "🧠"}, {word: "think", ch: "思考", icon: "🤔"}, {word: "learn", ch: "學習", icon: "🎓"}, {word: "study", ch: "研讀", icon: "📖"}, 
    {word: "love", ch: "愛", icon: "💖"}, {word: "like", ch: "喜歡", icon: "❤️"}, {word: "want", ch: "想要", icon: "🤲"}, {word: "help", ch: "幫助", icon: "⛑️"}, 
    {word: "work", ch: "工作", icon: "💼"}, {word: "live", ch: "居住", icon: "⛺"}
];

let learnedWords = new Set();
let currentQuestion = null;
let currentOptions = [];
let audioUnlocked = false; 

// 計算目前在哪一關 (每關50字)
function getCurrentStage() {
    const totalLearned = learnedWords.size;
    const stage = Math.floor(totalLearned / 50) + 1;
    return Math.min(stage, 6);
}

// 取得當前關卡的單字池範圍
function getCurrentStageWords() {
    const currentStage = getCurrentStage();
    const startIdx = (currentStage - 1) * 50;
    const endIdx = currentStage * 50;
    return wordBank.slice(startIdx, endIdx);
}

function initGame() {
    const savedData = localStorage.getItem("wordPetSaveData");
    if (savedData) {
        try {
            const parsedArray = JSON.parse(savedData);
            learnedWords = new Set(parsedArray);
        } catch (e) {
            learnedWords = new Set();
        }
    }
    generateQuestion();
    updateBagUI();
}

function saveGame() {
    const dataArray = Array.from(learnedWords);
    localStorage.setItem("wordPetSaveData", JSON.stringify(dataArray));
}

function resetGame() {
    if (confirm("確定要放生所有好不容易抓到的寵物嗎？😱")) {
        localStorage.removeItem("wordPetSaveData");
        learnedWords = new Set();
        initGame();
    }
}

function generateQuestion() {
    if (learnedWords.size >= wordBank.length) {
        document.getElementById("word-text").innerText = "🏆 通關大滿貫！";
        document.getElementById("monster-emoji").innerText = "👑";
        document.getElementById("feedback-text").innerText = "你已經成為終極單字大師！";
        document.getElementById("current-stage-display").innerText = "🎉 恭喜全部通關！";
        return;
    }

    const stageWords = getCurrentStageWords();
    // 優先在當前關卡中挑選還沒抓到的怪獸
    let unlearned = stageWords.filter(w => !learnedWords.has(w.word));
    
    // 如果當前關卡都抓完了，代表在等定時器跳下關，暫時在當前關卡複習
    if (unlearned.length === 0) unlearned = stageWords; 
    
    currentQuestion = unlearned[Math.floor(Math.random() * unlearned.length)];
    document.getElementById("monster-emoji").innerText = currentQuestion.icon;
    
    // 隨機拿其他關或本關的字當錯誤答案
    let wrongOptions = wordBank.filter(w => w.ch !== currentQuestion.ch).map(w => w.ch);
    wrongOptions.sort(() => 0.5 - Math.random());
    currentOptions = [currentQuestion.ch, wrongOptions[0], wrongOptions[1], wrongOptions[2]];
    currentOptions.sort(() => 0.5 - Math.random()); 
    
    document.getElementById("word-text").innerText = currentQuestion.word;
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach((btn, index) => {
        btn.innerText = currentOptions[index];
    });

    speakWord();
}

function speakWord() {
    if (!currentQuestion) return;
    const utterance = new SpeechSynthesisUtterance(currentQuestion.word);
    utterance.lang = 'en-US';
    utterance.rate = 0.85; 
    window.speechSynthesis.speak(utterance);
}

function unlockAudioContext() {
    if (!audioUnlocked) {
        audioUnlocked = true;
        speakWord(); 
    }
}

function checkAnswer(selectedIndex) {
    const feedback = document.getElementById("feedback-text");
    if (currentOptions[selectedIndex] === currentQuestion.ch) {
        feedback.style.color = "#4ECDC4";
        feedback.innerText = `🔴 成功收伏【${currentQuestion.icon} ${currentQuestion.word}】！`;
        learnedWords.add(currentQuestion.word);
        saveGame();
    } else {
        feedback.style.color = "#FF6B6B";
        feedback.innerText = `💨 哎呀！怪獸逃跑了！【${currentQuestion.word}】是 ${currentQuestion.ch}`;
    }
    
    updateBagUI();
    setTimeout(() => {
        feedback.innerText = "";
        generateQuestion();
    }, 1500);
}

function updateBagUI() {
    const totalCount = learnedWords.size;
    const currentStage = getCurrentStage();
    
    // 更新大關卡抬頭顯示
    document.getElementById("current-stage-display").innerText = `⭐ 第 ${currentStage} 關 (進度循序解鎖中)`;
    
    // 計算當前關卡內抓到了幾隻 (算完除以50的餘數)
    const stageCount = totalCount % 50;
    // 如果剛好滿50、100、150...且還沒全破，顯示50/50
    const displayStageScore = (totalCount > 0 && stageCount === 0 && totalCount < 300) ? 50 : stageCount;
    document.getElementById("stage-score").innerText = displayStageScore;
    
    // 總圖鑑背包計數
    document.getElementById("bag-count").innerText = `${totalCount} / 300 隻`;
    
    const bagGrid = document.getElementById("bag-grid");
    bagGrid.innerHTML = ""; 
    
    wordBank.forEach(w => {
        if (learnedWords.has(w.word)) {
            const slot = document.createElement("div");
            slot.className = "bag-slot";
            slot.innerText = w.icon;
            
            const tooltip = document.createElement("span");
            tooltip.className = "tooltip";
            tooltip.innerText = `${w.word} (${w.ch})`;
            
            slot.appendChild(tooltip);
            bagGrid.appendChild(slot);
        }
    });
}

initGame();
</script>
