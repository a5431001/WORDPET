<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Catchers</title>
    <style>
        :root {
            --primary: #FFCC00;
            --blue-tint: #3B4CCA;
            --background: #F0F4F8;
            --text: #2F3E46;
        }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', '微軟正黑體', sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 20px;
            border: 4px solid var(--primary);
            text-align: center;
        }
        .stage-info {
            background: #FFE66D;
            border-radius: 10px;
            padding: 5px 15px;
            display: inline-block;
            font-weight: bold;
            color: #333;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .battle-stage {
            background: linear-gradient(to bottom, #BDE0FE, #EAEAEA);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 20px;
            border: 2px solid #A2D2FF;
        }
        .monster-avatar {
            font-size: 55px;
            margin: 8px 0;
            animation: wild_bounce 1.5s infinite ease-in-out;
            display: inline-block;
        }
        @keyframes wild_bounce {
            0%, 100 canvas { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .quiz-box {
            background: #FFF;
            border: 2px dashed var(--blue-tint);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .word-display {
            font-size: 36px;
            font-weight: bold;
            color: #1D3557;
            margin-bottom: 5px;
        }
        .audio-btn {
            background: #EAF2F8;
            border: 1px solid #A9CCE3;
            border-radius: 20px;
            font-size: 15px;
            padding: 4px 12px;
            cursor: pointer;
            margin-bottom: 15px;
            color: #2471A3;
            font-weight: bold;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background: white;
            border: 2px solid #CED4DA;
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        .option-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }
        .feedback { font-size: 17px; font-weight: bold; margin-top: 15px; height: 25px; }
        .collection-box {
            background: #F8F9FA;
            border-radius: 15px;
            padding: 15px;
            border: 2px solid #E5E7EB;
            text-align: left;
        }
        .collection-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            color: #4A5568;
            border-bottom: 2px solid #CBD5E1;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .grid-bag {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
            padding: 5px;
        }
        .bag-slot {
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            text-align: center;
            padding: 4px 0;
            font-size: 22px;
            position: relative;
        }
        .bag-slot .tooltip {
            visibility: hidden; font-size: 10px; background-color: #333; color: #fff;
            text-align: center; border-radius: 4px; padding: 2px 5px;
            position: absolute; z-index: 1; bottom: 100%; left: 50%;
            transform: translateX(-50%); white-space: nowrap;
        }
        .bag-slot:hover .tooltip { visibility: visible; }
        .reset-btn { background: none; border: none; color: #9CA3AF; cursor: pointer; font-size: 11px; margin-top: 15px; text-decoration: underline; }
    </style>
</head>
