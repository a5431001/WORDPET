<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文單字寵物村 Word Pet Village</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --background: #F7FFF7;
            --text: #2F3E46;
        }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', '微軟正黑體', sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 20px;
            border: 4px solid #FFE66D;
            text-align: center;
            position: relative;
        }
        h1 { color: var(--primary); margin-top: 0; }
        
        /* 寵物狀態區 */
        .pet-stage {
            background: #E8F1F2;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
        }
        .pet-avatar {
            font-size: 80px;
            margin: 10px 0;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .status-bar {
            background: #ddd;
            border-radius: 10px;
            height: 20px;
            margin: 10px auto;
            width: 80%;
            overflow: hidden;
        }
        .progress {
            background: linear-gradient(90deg, #FF6B6B, #FFE66D);
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }

        /* 題目與按鈕區 */
        .quiz-box {
            background: #FFF;
            border: 2px dashed var(--secondary);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .word-display {
            font-size: 36px;
            font-weight: bold;
            color: #2B2D42;
            margin-bottom: 5px;
        }
        .audio-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background: white;
            border: 2px solid #CED4DA;
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }
        
        /* 回饋與控制按鈕 */
        .feedback {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            height: 25px;
        }
        .reset-btn {
            background-color: #e0e0e0;
            color: #666;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 15px;
        }
        .reset-btn:hover {
            background-color: #FF6B6B;
            color: white;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🐾 英文單字寵物村</h1>
    
    <div class="pet-stage">
        <div id="pet-title" style="font-weight: bold; color: #555;">載入中...</div>
        <div id="pet-avatar" class="pet-avatar">🥚</div>
        <div>學會單字量：<span id="score">0</span> / <span id="total-words">0</span></div>
        <div class="status-bar">
            <div id="progress-bar" class="progress"></div>
        </div>
    </div>

    <div class="quiz-box">
        <div id="word-text" class="word-display">---</div>
        <button onclick="speakWord()" class="audio-btn" title="聽發音">🔊 點我聽發音</button>
        
        <div class="options-grid">
            <button class="option-btn" onclick="checkAnswer(0)">選項 1</button>
            <button class="option-btn" onclick="checkAnswer(1)">選項 2</button>
            <button class="option-btn" onclick="checkAnswer(2)">選項 3</button>
            <button class="option-btn" onclick="checkAnswer(3)">選項 4</button>
        </div>
        <div id="feedback-text" class="feedback"></div>
    </div>

    <button class="reset-btn" onclick="resetGame()">🔄 重設遊戲進度（清除記憶）</button>
</div>

// 核心狀態
let learnedWords = new Set();
let currentQuestion = null;
let currentOptions = [];

document.getElementById("total-words").innerText = wordBank.length;

// 2. 遊戲初始化（從 LocalStorage 讀取進度）
function initGame() {
    const savedData = localStorage.getItem("wordPetSaveData");
    if (savedData) {
        try {
            const parsedArray = JSON.parse(savedData);
            learnedWords = new Set(parsedArray);
        } catch (e) {
            console.error("讀取存檔失敗，重新初始化", e);
            learnedWords = new Set();
        }
    }
    
    generateQuestion();
    updateUI();
}

// 3. 儲存進度至 LocalStorage
function saveGame() {
    const dataArray = Array.from(learnedWords);
    localStorage.setItem("wordPetSaveData", JSON.stringify(dataArray));
}

// 4. 重設遊戲進度
function resetGame() {
    if (confirm("確定要刪除所有進度，讓寵物重新投胎嗎？😱")) {
        localStorage.removeItem("wordPetSaveData");
        learnedWords = new Set();
        alert("進度已清除！重新開始冒險吧！");
        initGame();
    }
}

// 5. 產生新題目
function generateQuestion() {
    if (learnedWords.size >= wordBank.length) {
        document.getElementById("word-text").innerText = "🏆 大滿貫！";
        document.getElementById("feedback-text").style.color = "#FF6B6B";
        document.getElementById("feedback-text").innerText = "恭喜！你把所有的單字怪獸都收服了！";
        return;
    }

    // 挑選一個還沒學會的字
    let unlearned = wordBank.filter(w => !learnedWords.has(w.word));
    if (unlearned.length === 0) unlearned = wordBank; 
    
    currentQuestion = unlearned[Math.floor(Math.random() * unlearned.length)];
    
    // 製作四選一選項
    let wrongOptions = wordBank.filter(w => w.ch !== currentQuestion.ch).map(w => w.ch);
    wrongOptions.sort(() => 0.5 - Math.random());
    
    currentOptions = [currentQuestion.ch, wrongOptions[0], wrongOptions[1], wrongOptions[2]];
    currentOptions.sort(() => 0.5 - Math.random()); 
    
    // 更新網頁畫面
    document.getElementById("word-text").innerText = currentQuestion.word;
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach((btn, index) => {
        btn.innerText = currentOptions[index];
    });
    
    speakWord();
}

// 6. 語音朗讀功能
function speakWord() {
    if (!currentQuestion) return;
    const utterance = new SpeechSynthesisUtterance(currentQuestion.word);
    utterance.lang = 'en-US';
    utterance.rate = 0.85; 
    window.speechSynthesis.speak(utterance);
}

// 7. 檢查答案並觸發自動存檔
function checkAnswer(selectedIndex) {
    const feedback = document.getElementById("feedback-text");
    if (currentOptions[selectedIndex] === currentQuestion.ch) {
        feedback.style.color = "#4ECDC4";
        feedback.innerText = "🎉 答對了！寵物開心地吃著點心 🍪";
        
        learnedWords.add(currentQuestion.word);
        saveGame();
    } else {
        feedback.style.color = "#FF6B6B";
        feedback.innerText = `❌ 答錯囉！【${currentQuestion.word}】是 ${currentQuestion.ch}`;
    }
    
    updateUI();
    
    setTimeout(() => {
        feedback.innerText = "";
        generateQuestion();
    }, 1500);
}

// 8. 更新畫面與寵物狀態 (配合300個字調整階段)
function updateUI() {
    const count = learnedWords.size;
    document.getElementById("score").innerText = count;
    
    const percent = (count / wordBank.length) * 100;
    document.getElementById("progress-bar").style.width = `${percent}%`;
    
    const avatar = document.getElementById("pet-avatar");
    const title = document.getElementById("pet-title");
    
    if (count >= 250) {
        avatar.innerText = "🐉";
        title.innerText = "等級 4：終極飛天巨龍 👑 (神話階段)";
    } else if (count >= 120) {
        avatar.innerText = "🐕";
        title.innerText = "等級 3：忠誠戰鬥犬 💪 (成長期)";
    } else if (count >= 30) {
        avatar.innerText = "🐥";
        title.innerText = "等級 2：可愛小雞怪 🐤 (幼年期)";
    } else {
        avatar.innerText = "🥚";
        title.innerText = "等級 1：萌萌單字蛋 💤 (孵化期)";
    }
}

// 啟動遊戲
initGame();
</script>

</body>
</html>
